# One grouped pull request per month. Action updates touch workflows (high
# risk), so they wait for the owner's approval; Python updates auto-merge
# once CI passes.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: monthly
    groups:
      python:
        patterns: ["*"]
