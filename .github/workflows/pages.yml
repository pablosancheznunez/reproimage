# Publishes the site: the package documentation (pkgdown) and an example
# report generated by the Python tool. Rebuilt on every change to main, so the
# documentation always matches the code.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::pkgdown, local::.
          needs: website
      - name: Build the package site
        run: Rscript -e 'pkgdown::build_site("r", override = list(destination = "../_site"), new_process = FALSE, install = FALSE)'
      - name: Add the example report (Python tool on the reference images)
        run: |
          python -m pip install -q .
          reproimage analyze r/inst/extdata/reference/images --out _site/example
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
